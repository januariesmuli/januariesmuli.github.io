
# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog.
# You can edit this file to personalize your professional portfolio.

# Site settings
title: "Januaries Muli"
email:
description: >-
  Januaries Muli is an ICT Technician, Web Developer, Systems Developer
  and Cybersecurity Enthusiast with professional experience in ICT support,
  networking, system development, cybersecurity, web technologies,
  server administration and ICT infrastructure management.
twitter_username:
github_username: "YOUR_GITHUB_USERNAME"
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Africa/Nairobi

include:
  - _pages

# Exclude from processing.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "Januaries Muli"
  avatar: "/assets/images/bio-photo.jpg"
  bio: >-
    Diocesan ICT Technician | Web Developer | Systems Developer |
    Cybersecurity Enthusiast. Experienced in ICT infrastructure,
    networking, system administration, web development and cybersecurity.
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://maralalcatholicdiocese.org/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/YOUR_GITHUB_USERNAME"

footer:
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://maralalcatholicdiocese.org/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/YOUR_GITHUB_USERNAME"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
